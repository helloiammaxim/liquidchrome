function loadHdriFile(file){
  const url = URL.createObjectURL(file);
  const img = new Image();
  img.crossOrigin = 'anonymous';
  img.onload = ()=>{
    URL.revokeObjectURL(url);
    if (STATE.material.hdriTex) gl.deleteTexture(STATE.material.hdriTex);
    STATE.material.hdriTex = makeTextureFromImage(img);
    STATE.material.hdriUploaded = true;
    STATE.material.source = 'hdri';
    $$('#mat-source button').forEach(b=>b.classList.toggle('active', b.dataset.v === 'hdri'));
    STATE.needsRedraw = true;
    setStatus('environment loaded');
  };
  img.src = url;
}

// drag-and-drop
window.addEventListener('dragenter', e => { e.preventDefault(); $('#dropzone').classList.add('visible'); });
$('#dropzone').addEventListener('dragover',  e => { e.preventDefault(); });
$('#dropzone').addEventListener('dragleave', e => { e.preventDefault(); $('#dropzone').classList.remove('visible'); });
$('#dropzone').addEventListener('drop', e => {
  e.preventDefault(); $('#dropzone').classList.remove('visible');
  const f = e.dataTransfer.files[0];
  if (!f) return;
  // ask: matcap or hdri? simplification: default hdri unless square
  const img = new Image();
  img.onload = ()=>{
    if (Math.abs(img.width - img.height) < 4) loadMatcapFile(f);
    else loadHdriFile(f);
  };
  img.src = URL.createObjectURL(f);
});

// ---------------------------------------------------------------------
// Camera
// ---------------------------------------------------------------------
async function startCamera(){
  if (STATE.camera.enabled) return;
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } },
      audio: false
    });
    const v = document.createElement('video');
    v.playsInline = true; v.muted = true; v.autoplay = true;
    v.srcObject = stream;
    await v.play();
    STATE.camera.video = v;
    STATE.camera.stream = stream;
    STATE.camera.enabled = true;
    $('#status').classList.add('live');
    setStatus('camera live');
  } catch (err){
    console.warn(err);
    setStatus('camera denied');
    STATE.material.source = 'matcap';
    $$('#mat-source button').forEach(b=>b.classList.toggle('active', b.dataset.v === 'matcap'));
  }
}
function stopCamera(){
  if (STATE.camera.stream) STATE.camera.stream.getTracks().forEach(t=>t.stop());
  STATE.camera.enabled = false; STATE.camera.video = null; STATE.camera.stream = null;
  $('#status').classList.remove('live');
}

// ---------------------------------------------------------------------
// Theme
// ---------------------------------------------------------------------
$('#theme-tog').addEventListener('click', ()=>{
  const cur = document.documentElement.getAttribute('data-theme');
  document.documentElement.setAttribute('data-theme', cur === 'dark' ? 'light' : 'dark');
  STATE.needsRedraw = true;
});

// ---------------------------------------------------------------------
// Clear / Undo
// ---------------------------------------------------------------------
function clearAll(){
  STATE.strokes = [];
  STATE.texts = [];
  STATE.selectedTextId = null;
  buildTextDom();
  clearFBO(STATE.field);
  STATE.needsRedraw = true;
  setStatus('cleared');
}
$('#clear-btn').addEventListener('click', clearAll);

function undo(){
  if (!STATE.strokes.length) return;
  const last = STATE.strokes.pop();
  if (last.kind === 'text'){
    STATE.texts = STATE.texts.filter(t => t.id !== last.id);
    if (STATE.selectedTextId === last.id) STATE.selectedTextId = null;
    buildTextDom();
  }
  STATE.needsFieldRebuild = true;
  setStatus('undo');
}
$('#undo-btn').addEventListener('click', undo);

// ---------------------------------------------------------------------
// Export
// ---------------------------------------------------------------------
const exportModal = $('#export-modal');
$('#export-btn').addEventListener('click', ()=> exportModal.classList.add('visible'));
$('#export-close').addEventListener('click', ()=> exportModal.classList.remove('visible'));
exportModal.addEventListener('click', (e)=>{ if (e.target === exportModal) exportModal.classList.remove('visible'); });

let exportRes = 1, exportBg = 'opaque';
bindSeg('#export-res', v => exportRes = parseFloat(v));
bindSeg('#export-bg',  v => exportBg = v);

$('#export-go').addEventListener('click', ()=>{
  doExport(exportRes, exportBg === 'transparent');
});

async function doExport(scale, transparent){
  setStatus('exporting…');
  const w = Math.floor(STATE.width  * STATE.pixelRatio * scale);
  const h = Math.floor(STATE.height * STATE.pixelRatio * scale);

  // create offscreen FBOs at target resolution
  const fieldHi     = makeFBO(w, h);
  const fieldHiTmp  = makeFBO(w, h);
  const fieldHiBlur = makeFBO(w, h);
  const dispHi      = makeRGBA8FBO(w, h);  // RGBA8 — safe for readPixels

  // Inflate pixelRatio so renderStrokeSegment scales CSS-pixel positions correctly
  const oldPR = STATE.pixelRatio;
  STATE.pixelRatio = oldPR * scale;
  rebuildField(fieldHi);
  STATE.pixelRatio = oldPR;

  // blur the hi-res field
  doBlurPass(fieldHi, fieldHiTmp, fieldHiBlur, STATE.material.blurAmount * scale);

  // render display pass into dispHi
  present(dispHi, { width: w, height: h, transparentBg: transparent, fieldTex: fieldHiBlur.tex });

  // read pixels back (WebGL y is flipped relative to canvas)
  const pixels = new Uint8Array(w * h * 4);
  gl.bindFramebuffer(gl.FRAMEBUFFER, dispHi.fbo);
  gl.readPixels(0, 0, w, h, gl.RGBA, gl.UNSIGNED_BYTE, pixels);
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);

  // flip Y rows
  const canvas = document.createElement('canvas');
  canvas.width = w; canvas.height = h;
  const ctx = canvas.getContext('2d');
  const imgData = ctx.createImageData(w, h);
  for (let row = 0; row < h; row++){
    const src = (h - 1 - row) * w * 4;
    const dst = row * w * 4;
    imgData.data.set(pixels.subarray(src, src + w * 4), dst);
  }
  ctx.putImageData(imgData, 0, 0);

  canvas.toBlob((blob)=>{
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `liquid-chrome_${w}x${h}_${transparent ? 'alpha':'solid'}.png`;
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
    setStatus('saved');
  }, 'image/png');

  // cleanup temporary FBOs
  [fieldHi, fieldHiTmp, fieldHiBlur, dispHi].forEach(fbo => {
    gl.deleteFramebuffer(fbo.fbo); gl.deleteTexture(fbo.tex);
  });
  exportModal.classList.remove('visible');
}

// ---------------------------------------------------------------------
// Status
// ---------------------------------------------------------------------
let statusTimer = null;
function setStatus(s){
  $('#status-txt').textContent = s;
  if (statusTimer) clearTimeout(statusTimer);
  statusTimer = setTimeout(()=> $('#status-txt').textContent = STATE.camera.enabled ? 'camera live' : 'ready', 1800);
}

// ---------------------------------------------------------------------
// Init
// ---------------------------------------------------------------------
resize();
loop();
setStatus('ready');

// mobile: show inspector toggle button only on mobile; on desktop inspector always visible
function applyMobile(){
  const isMob = window.innerWidth <= 720;
  $('#inspector-tog').style.display = isMob ? 'flex' : 'none';
  // on desktop: remove any display:none that media-query doesn't apply
  // on mobile: start closed (user taps toggle to open)
  if (!isMob){
    // ensure no leftover visibility class interferes on desktop
    $('#inspector').style.display = '';
  }
}
applyMobile();
window.addEventListener('resize', applyMobile);
$('#inspector-tog').addEventListener('click', ()=>{
  $('#inspector').classList.toggle('visible');
});

</script>
